<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Sacred Verse</title>
  <meta
    name="description"
    content="A minimalist homepage that shares a daily verse from The Hidden Words and the current Badíʿ date."
  />
  <meta property="og:title" content="Daily Sacred Verse" />
  <meta
    property="og:description"
    content="A minimalist homepage that shares a daily verse from The Hidden Words and the current Badíʿ date."
  />
  <meta property="og:type" content="website" />

  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700|Source+Serif+Pro:400,600"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="light-mode">
  <!-- FLOATING THEME TOGGLE (top-right) -->
  <button id="theme-toggle-button" class="theme-toggle-floating" aria-label="Toggle light / dark mode">
    <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
  </button>

  <!-- TODAY JUMBOTRON -->
  <main class="quote-jumbotron" id="main-jumbotron">
    <div class="quote-content-wrapper">
      <h1 id="quote-text" aria-live="polite" aria-atomic="true">Loading Sacred Verse…</h1>
      <div class="attribution-line"><p id="quote-author" class="quote-author"></p></div>
      <div class="quote-actions">
        <button id="copy-button" type="button" class="button button-inline">Copy</button>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      </div>
      <div class="status-row">
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        <button id="retry-button" type="button" class="button button-inline" hidden>Retry</button>
      </div>
    </div>
    <button
      id="scroll-down-arrow"
      class="scroll-down-arrow"
      type="button"
      aria-label="Scroll to date section"
    >
      <img src="img/downArrow-01.png" alt="Scroll to date section" />
    </button>
  </main>

  <!--  SCROLLABLE SECTION  -->
  <div id="scroll-content-start" class="scrollable-content">
    <!-- CITATION -->
    <div class="panel-citation">
      <div class="panel-content-constrained">
        <p id="quote-source-full"></p>
      </div>
    </div>

    <!-- BADÍʿ DATE  -->
    <div class="panel-buttons panel-date">
      <div class="panel-content-constrained date-layout-centered">
        <h2
          id="badiDate"
          class="badi-date-title clickable-date"
          title="Show / hide Gregorian date"
          role="button"
          tabindex="0"
        >
          Loading Badíʿ Date…
        </h2>
        <p id="gregorianDatePanel" class="date-text"></p>
        <p id="location-message" class="date-note" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- YESTERDAY BUTTON -->
    <div class="panel-buttons panel-buttons-yesterday">
      <div class="panel-content-constrained buttons-layout-centered">
        <button
          id="yesterday-button"
          class="button"
          type="button"
          aria-expanded="false"
          aria-controls="yesterday-jumbotron-display"
        >
          Yesterday
        </button>
      </div>
    </div>

    <footer><div class="panel-content-constrained"></div></footer>
  </div>

  <!--  YESTERDAY JUMBOTRON  -->
  <section class="quote-jumbotron" id="yesterday-jumbotron-display" hidden>
    <div class="quote-content-wrapper">
      <h2 id="quote-text-yesterday" aria-live="polite" aria-atomic="true">
        Loading Sacred Verse…
      </h2>
      <div class="attribution-line"><p id="quote-author-yesterday" class="quote-author"></p></div>
      <div class="quote-actions">
        <button id="copy-button-yesterday" type="button" class="button button-inline">Copy</button>
        <p id="copy-status-yesterday" class="copy-status" role="status" aria-live="polite"></p>
      </div>

      <!-- ARROW THAT TOGGLES CITATION -->
      <button
        id="yesterday-arrow"
        class="toggle-citation-arrow"
        type="button"
        aria-label="Show citation"
        aria-controls="quote-source-full-yesterday"
        aria-expanded="false"
      >
        <img src="img/downArrow-01.png" alt="Toggle citation" />
      </button>

      <!-- HIDDEN CITATION -->
      <p id="quote-source-full-yesterday" class="yesterday-citation"></p>
    </div>
  </section>

  <script src="https://wondrous-badi.today/scripts/BadiDateToday.v1.js" defer></script>
  <script src="js/badi-init.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
