# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/super-linter/super-linter
#
# Scope note: this repository checks prose (markdownlint), YAML, secrets and workflow security. It does NOT
# lint, format or statically analyse the served site: index.html, wallpaper.html and js/* are frozen product
# files, and the checks that target them run without a config this repository has adopted. Full rationale:
# docs/DECISIONS.md (D10, D12).
name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read # to clone the repository
  statuses: write # to report the per-linter status checks

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lint only the files a change actually touches.
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          # ---- Categories this repository turns off on purpose (D10) ----
          # textlint is the whole natural-language category, and it ships exactly
          # one rule: `terminology`, a general-English style glossary that rejects
          # this repository's own documented vocabulary ("repo" -> "repository",
          # "build system" -> "build tool"). Every finding it ever produced here
          # was that class of false positive.
          VALIDATE_NATURAL_LANGUAGE: false
          # Biome would reformat css/* and js/*, which are frozen byte-identical
          # by contract (D8). The formatter's "fix" would be a product change.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Prettier-on-markdown would rewrite PHASE1_HANDOFF.md and
          # docs/DECISIONS.md -- append-only records that must stay byte-for-byte
          # as written. markdownlint below is the markdown checker of record, and
          # upstream lists markdownlint and prettier as a conflicting pair.
          VALIDATE_MARKDOWN_PRETTIER: false
          # jscpd scans the whole tree (it ignores VALIDATE_ALL_CODEBASE) and
          # flags prose repetition in those same records, plus the byte-identical
          # corpus copy in ios/widget/ that is tracked debt for H2B. Neither is a
          # code smell to fix here.
          VALIDATE_JSCPD: false
          # ---- Product-file checks this repository turns off on purpose (D12) ----
          # These four had never run before 2026-09-10: super-linter lints only the
          # changed set, and no earlier change had ever included index.html or
          # js/*. Their long "pass" was vacuous, and the first legitimate
          # product-file change (queue H2A) surfaced only findings that predate it.
          # Same class as the D10 block above: a check whose only targets here are
          # frozen product files, running without a config this repository adopted.
          # htmlhint runs with super-linter's default config, which we never
          # adopted. Its targets are index.html and wallpaper.html only, and its
          # findings were two camelCase ids (badiDate, gregorianDatePanel) --
          # htmlhint's preferred naming is a style preference we do not hold.
          VALIDATE_HTML: false
          # Prettier-over-HTML: targets are the two frozen product pages.
          VALIDATE_HTML_PRETTIER: false
          # eslint also runs with its default config, and this repository has never
          # had an eslintrc. The served scripts are classic cross-file scripts, so
          # the defaults report false positives: a function defined in
          # js/badi-init.js and called from js/script.js reads as "unused", and the
          # external BadiDateToday global (set by the Badíʿ date library) reads as
          # "undefined". Without a config, a green result here means less than the
          # noise it costs.
          VALIDATE_JAVASCRIPT_ES: false
          # Prettier-over-JS: targets are the frozen js/*.js.
          VALIDATE_JAVASCRIPT_PRETTIER: false
          # ---- Checks that announced themselves but did not run (D15, queue C5) ----
          # commitlint announced itself as enabled while having no config, and
          # this repository's commit discipline lives in its append-only
          # decision ledger (docs/DECISIONS.md), not in a linter -- so it is
          # turned off explicitly rather than left to warn-and-disable itself
          # on every run.
          VALIDATE_GIT_COMMITLINT: false
          # The summary pair was a misconfiguration: two flags enabled a summary
          # that a third (SAVE_SUPER_LINTER_SUMMARY, default false) prevented,
          # and this job deliberately does not hold `pull-requests: write`, so a
          # PR summary comment could never post anyway. The owner chose to turn
          # the summary OFF (D15): both enable flags are now explicitly false,
          # making the set consistent so the warning cannot occur.
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # Python (D15): Ruff is the Python linter of record and runs for real
          # on scripts/*.py. VALIDATE_PYTHON_RUFF is left at its default (true);
          # it is not toggled here because super-linter rejects a config that
          # mixes explicit true and false VALIDATE_* entries. Black and Ruff's
          # formatter are off -- unadopted formatters, the same policy as the
          # D10 formatter block -- and turning Black off is exactly what removes
          # super-linter's Black-vs-Ruff conflict warning. Ruff's linter
          # genuinely runs and passes (three F541 fixed, see D15).
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
