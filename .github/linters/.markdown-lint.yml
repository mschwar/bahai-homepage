---
###########################
###########################
## Markdown Linter rules ##
###########################
###########################

# Linter rules doc:
# - https://github.com/DavidAnson/markdownlint
#
# Note:
# To comment out a single error:
#   <!-- markdownlint-disable -->
#   any violations you want
#   <!-- markdownlint-restore -->
#
# Project note: this file is super-linter's TEMPLATES/.markdown-lint.yml, verbatim, plus two
# project additions at the end of the "Rules by id" block (MD041, MD060).
# They were added when the action moved to v8.7.0, which took the bundled markdownlint-cli
# from 0.33 to 0.49 and brought new default rules. Rationale: docs/DECISIONS.md (D10).

###############
# Rules by id #
###############
MD004: false # Unordered list style
MD007:
  indent: 2 # Unordered list indentation
MD013:
  line_length: 400 # Line length 80 is far too short
MD026:
  punctuation: ".,;:!。，；:" # List of not allowed
MD029: false # Ordered list item prefix
MD033: false # Allow inline HTML
MD036: false # Emphasis used instead of a heading
# Project additions:
MD041: false # docs/history/* lead with a SUPERSEDED banner, not an H1 (D5).
  # Multi-H1 is still caught by MD025, which stays enabled.
MD060:
  style: leading_and_trailing # Our tables are padded, but the rule infers
  # "compact" from the |---|---| separator row and then flags every data row.
  # Pinning the style keeps the rule enforcing consistency; it is not disabled.

#################
# Rules by tags #
#################
blank_lines: false # Error on blank lines
